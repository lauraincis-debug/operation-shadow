name: Auto-Deploy Omni-Sport & Football AI Ultra v6.0 + Cloé Abidjan (Live Internet Harvester)

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "football-ai/**"
      - "cloe-abidjan/**"
      - ".github/workflows/firebase-auto-deploy.yml"
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  deploy-firebase-both-apps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate Google Cloud CLI
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Test, Build & Harvest Real Live Internet Multi-Sport Matches (44 Competitions / 7 Sports)
        working-directory: football-ai
        run: |
          npm ci
          npm run test:model
          npm run build
          node scripts/harvest-live-internet.mjs

      - name: Complete Cloé Abidjan Assets & Embed Live Omni-Sport v6 Engine
        run: |
          cp -f football-ai/www/cloe-bridge.js cloe-abidjan/cloe-bridge.js
          cp -f football-ai/www/live-omni-snapshot.json football-ai/cloe-www/live-omni-snapshot.json || true
          node -e '
            const fs = require("fs");
            const path = require("path");
            (async () => {
              const base = "https://cloe-abidjan.web.app";
              const extra = [
                "/install.html",
                "/manrope-400.woff2",
                "/manrope-600.woff2",
                "/manrope-800.woff2",
                "/unbounded-500.woff2",
                "/unbounded-700.woff2",
                "/MANDAT_CADRE_A_SIGNER.md",
                "/GUIDE_DECLARATION_ACTIVITE_CI.md",
                "/MODELES_DEVIS_CONTRAT_FACTURE.md"
              ];
              for (const u of extra) {
                const dest = path.join("cloe-abidjan", u);
                if (fs.existsSync(dest)) continue;
                try {
                  const r = await fetch(base + u);
                  if (r.ok && (!(r.headers.get("content-type") || "").includes("text/html") || u.endsWith(".html"))) {
                    const buf = Buffer.from(await r.arrayBuffer());
                    if (buf.length > 0) fs.writeFileSync(dest, buf);
                  }
                } catch {}
              }
            })();
          '

      - name: Deploy Omni-Sport & Football AI Ultra v6.0 (https://football-ai-43e33.web.app)
        working-directory: football-ai
        run: |
          npx -y firebase-tools deploy --only hosting --project football-ai-43e33

      - name: Deploy Cloé · Agent Personnel Abidjan v6.0 (https://cloe-agent-abidjan.web.app)
        run: |
          ABJ_SITE="cloe-agent-abidjan"
          npx -y firebase-tools hosting:sites:create "$ABJ_SITE" --project football-ai-43e33 || true
          TMP_ABJ=$(mktemp -d)
          cp -a cloe-abidjan "$TMP_ABJ/public"
          printf '{"hosting":{"site":"%s","public":"public","ignore":["firebase.json","**/.*","*.sh","FIREBASE_DEPLOY_REPORT.json","LIVE_INTERNET_HARVEST_REPORT.json"],"headers":[{"source":"/index.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/sw.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/cloe-bridge.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/live-omni-snapshot.json","headers":[{"key":"Access-Control-Allow-Origin","value":"*"},{"key":"Cache-Control","value":"public, max-age=120"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}\n' "$ABJ_SITE" > "$TMP_ABJ/firebase.json"
          (cd "$TMP_ABJ" && npx -y firebase-tools deploy --only hosting --project football-ai-43e33)
          printf '{\n  "cloeAgentAbidjanLiveUrl": "https://cloe-agent-abidjan.web.app",\n  "footballAiLiveUrl": "https://football-ai-43e33.web.app",\n  "cloeIaUltraLiveUrl": "https://cloe-ia-ultra.web.app",\n  "version": "6.0.0-omni-truth",\n  "updatedAt": "%s"\n}\n' "$(date -u +%FT%TZ)" > cloe-abidjan/FIREBASE_DEPLOY_REPORT.json

      - name: Deploy Cloé IA Ultra v6.0 (https://cloe-ia-ultra.web.app) & Save Live Harvest Report
        run: |
          CLOE_SITE="cloe-ia-ultra"
          npx -y firebase-tools hosting:sites:create "$CLOE_SITE" --project football-ai-43e33 || true
          TMP_DIR=$(mktemp -d)
          cp -a football-ai/cloe-www "$TMP_DIR/cloe-www"
          printf '{"hosting":{"site":"%s","public":"cloe-www","headers":[{"source":"/index.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/sw.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}\n' "$CLOE_SITE" > "$TMP_DIR/firebase.json"
          (cd "$TMP_DIR" && npx -y firebase-tools deploy --only hosting --project football-ai-43e33)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloe-abidjan/FIREBASE_DEPLOY_REPORT.json cloe-abidjan/LIVE_INTERNET_HARVEST_REPORT.json
          git commit -m "chore(ci-v6): live internet omni-sport harvest + firebase report [skip ci]" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true
